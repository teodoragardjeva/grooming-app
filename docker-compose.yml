# Production-like stack: PostgreSQL + migrations + Next.js app + daily housekeeping + Caddy (automatic HTTPS).
# Configure with a .env file next to this file (see .env.example). Start: docker compose up -d --build
name: grooming

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grooming}
      POSTGRES_USER: ${POSTGRES_USER:-grooming}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host. For a local psql: docker compose exec db psql -U grooming

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-grooming}
      PGUSER: ${POSTGRES_USER:-grooming}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SEED_EXAMPLE_DATA: ${SEED_EXAMPLE_DATA:-0}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-grooming}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grooming}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?set TOKEN_HASH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Chatbot: /api/chat relays visitor messages to the n8n webhook (internal network only) with this shared secret.
      BOT_SECRET: ${BOT_SECRET:?set BOT_SECRET in .env (openssl rand -hex 32)}
      N8N_CHAT_WEBHOOK_URL: http://n8n:5678/webhook/grooming-chat
    volumes:
      - media:/data/media
    expose:
      - "3000"

  # Chatbot workflow engine. Same compose network as the app (reaches it as http://app:3000). The webhook is NOT
  # published: only /api/chat in the app can call it. The editor is bound to the server's loopback only; open it with
  # an SSH tunnel (ssh -L 5678:localhost:5678 user@server) until it is put behind the reverse proxy with auth.
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false" # editor is only reachable on loopback / through a tunnel
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: Europe/Sofia
      TZ: Europe/Sofia
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflow reads these with $env.* (kept out of the exported workflow JSON).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      APP_BASE_URL: http://app:3000
      BOOKING_BOT_SECRET: ${BOT_SECRET}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  # Backup housekeeping (expired holds, old tokens/sessions). Correctness never depends on it.
  cron:
    image: alpine:3
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          sleep 86400
          wget -q -O /dev/null --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/cleanup || true
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Your domain (e.g. example.com) for automatic HTTPS; ":80" serves plain HTTP (local use).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  n8n_data:
  caddy_data:
  caddy_config:
