name: Release
# Manual run (Actions -> Release -> Run workflow): enter a semver version and the image is built from the
# selected branch/tag and pushed to GHCR as ghcr.io/<owner>/grooming-app:<version> and ghcr.io/<owner>/grooming-n8n:<version>
# (the n8n image carries the chatbot workflow from the same commit). A git tag v<version> is created too.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version without the leading v, e.g. 1.2.3 or 1.2.3-rc.1"
        required: true
        type: string
      latest:
        description: "Also move the `latest` tag to this build"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag
      packages: write # push to GHCR
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version (expected MAJOR.MINOR.PATCH, e.g. 1.2.3)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse to overwrite an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ inputs.latest }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same build-time values as the publish job in ci.yml (NEXT_PUBLIC_* is inlined into the browser bundle).
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://magic-paws.robodigit.win' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Same version for the n8n image (chatbot workflow baked in), so one version identifies a matching pair.
      - id: meta-n8n
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/grooming-n8n
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ inputs.latest }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./n8n
          push: true
          tags: ${{ steps.meta-n8n.outputs.tags }}
          labels: ${{ steps.meta-n8n.outputs.labels }}
          cache-from: type=gha,scope=n8n
          cache-to: type=gha,mode=max,scope=n8n
      - name: Tag the commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
