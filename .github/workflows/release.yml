name: Release
# Manual run (Actions -> Release -> Run workflow): enter a semver version and the image is built from the
# selected branch/tag and pushed to GHCR as ghcr.io/<owner>/<repo>:<version>. A git tag v<version> is created too.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version without the leading v, e.g. 1.2.3 or 1.2.3-rc.1"
        required: true
        type: string
      latest:
        description: "Also move the `latest` tag to this build"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag
      packages: write # push to GHCR
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version (expected MAJOR.MINOR.PATCH, e.g. 1.2.3)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Refuse to overwrite an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ inputs.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same build-time values as the publish job in ci.yml (NEXT_PUBLIC_* is inlined into the browser bundle).
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://magic-paws.robodigit.win' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag the commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
